# ============================================================
#  ODYSSEY · kitty configuration
#  palette: #000 base · #050505 elev · #e8192c accent
# ============================================================

# --- font ---------------------------------------------------
font_family       JetBrains Mono
bold_font         JetBrains Mono Bold
italic_font       JetBrains Mono Italic
bold_italic_font  JetBrains Mono Bold Italic
font_size         11.0
disable_ligatures never
modify_font cell_height 110%

# --- window -------------------------------------------------
window_padding_width      8
window_border_width       0
hide_window_decorations   no
confirm_os_window_close   0
background_opacity        1.0
remember_window_size      yes

# --- cursor -------------------------------------------------
cursor_shape          block
cursor_blink_interval 0.5
cursor                #e8192c
cursor_text_color     #000000

# --- selezione ----------------------------------------------
selection_foreground #000000
selection_background #e8192c

# --- scrollback ---------------------------------------------
scrollback_lines 20000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INFO

# --- url ----------------------------------------------------
url_color #e8192c
url_style single

# --- tab bar (custom: disegnata da tab_bar.py) --------------
tab_bar_edge          top
tab_bar_style         custom
tab_bar_align         left
tab_bar_min_tabs      1
active_tab_foreground   #e8e4e0
active_tab_background   #000000
inactive_tab_foreground #888888
inactive_tab_background #050505
tab_bar_background      #050505
tab_separator           ""

# --- colori base finestra -----------------------------------
foreground            #e8e4e0
background            #000000

# --- palette ANSI Odyssey -----------------------------------
color0  #000000
color1  #e8192c
color2  #888888
color3  #e8e4e0
color4  #555555
color5  #e8192c
color6  #888888
color7  #e8e4e0
color8  #1a1a1e
color9  #ff2238
color10 #aaaaaa
color11 #ffffff
color12 #888888
color13 #ff2238
color14 #aaaaaa
color15 #ffffff

# --- mouse map sulla riga "launch" --------------------------
mouse_map right press ungrabbed paste_from_clipboard

# --- keybinding scorciatoia ---------------------------------
map ctrl+shift+space kitten odyssey-launch.py

# --- altre keybindings utili --------------------------------
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+enter new_window

# --- copia / incolla ----------------------------------------
# ctrl+c "intelligente": se c'è selezione copia, altrimenti SIGINT
map ctrl+c     copy_or_interrupt
map ctrl+v     paste_from_clipboard
# scorciatoie kitty standard come fallback
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# --- shell integration: lascia il titolo tab alla shell -----
shell_integration enabled no-title
